name: rmf_stack

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_PORT:-1883}:${MQTT_PORT:-1883}"
    networks:
      - rmf2-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -p ${MQTT_PORT:-1883} -t healthcheck -m ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  amqp-broker:
    image: rabbitmq:3-management
    ports:
      - "${AMQP_PORT:-5672}:${AMQP_PORT:-5672}"
      - "${AMQP_MGMT_PORT:-15672}:${AMQP_MGMT_PORT:-15672}"
    networks:
      - rmf2-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # scheduler:
  # TODO

  # task-orchestrator:
  # TODO

  # map-server:
  # TODO

  mapf-planner:
    image: ${MAPF_PLANNER_IMAGE:-ghcr.io/gametl/res_mapf_gametl/amqp-planner:main}
    platform: linux/amd64
    depends_on:
      amqp-broker:
        condition: service_healthy
    networks:
      - rmf2-net
    environment:
      AMQP_HOST: amqp-broker
      AMQP_PORT: "${AMQP_PORT:-5672}"
      AMQP_EXCHANGE: ${AMQP_EXCHANGE:-mapf.tasks}
      AMQP_QUEUE: ${AMQP_QUEUE:-mapf.planner}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Headless AMQP planner: liveness == the uv/main process runs.
    healthcheck:
      test:
        ["CMD-SHELL", "pgrep -f 'main.py' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped


  vda5050-master:
    image: ${VDA5050_MASTER_IMAGE:-ghcr.io/gametl/vda5050-python/master:main}
    platform: linux/amd64
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks:
      - rmf2-net
    environment:
      MQTT_BROKER: tcp://mqtt-broker:${MQTT_PORT:-1883}
      PYTHONUNBUFFERED: "1"
      MASTER_MQTT_CLIENT_ID: ${MASTER_MQTT_CLIENT_ID:-example-master}
      VDA5050_MANUFACTURER: ${VDA5050_MANUFACTURER:-ACME}
      VDA5050_SERIAL_NUMBER: ${VDA5050_SERIAL_NUMBER:-AGV-001}
    # Headless MQTT master: liveness == the uv/main process runs.
    healthcheck:
      test:
        ["CMD-SHELL", "pgrep -f 'main.py' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  ui:
    image: ${UI_IMAGE:-ghcr.io/ros-industrial/rmf2-ui/dashboard:main}
    platform: linux/amd64
    ports:
      - "${UI_PORT:-3000}:${NGINX_PORT:-80}"
    networks:
      - rmf2-net
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:${NGINX_PORT:-80}/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  rmf2-net:
    driver: bridge
    name: rmf2_demo_gametl_rmf2-net
